name: Gold Quant Alpha Scan

"on":
  schedule:
 - cron: "*/15 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gold_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Gold Quant Scan
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python signal_engine.py gold
      - name: Commit and Push State and Journal
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/journal.csv || true
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(bot): update gold state [skip ci]"
          git push || true
