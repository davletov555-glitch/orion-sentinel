name: Midnight Summary (00:00 MSK / 21:00 UTC)

on:
  schedule:
- cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  midnight_summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dispatch Midnight Summary
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python signal_engine.py summary_00

      - name: Commit & Push Journal
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/journal.csv || true
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(bot): log midnight summary [skip ci]"
          git push || true
