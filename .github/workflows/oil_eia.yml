name: Oil EIA Weekly Trigger (Wed 17:30 MSK)

on:
  schedule:
- cron: "30 14 * * 3"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  oil_eia:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Oil EIA Pipeline
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          python signal_engine.py oil_eia

      - name: Commit & Push State & Journal
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/journal.csv || true
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(bot): update oil eia journal [skip ci]"
          git push || true
